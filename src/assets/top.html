<!DOCTYPE HTML>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" type="text/css" href="css/style.css">
<title>ライブ配信管理ページ (${user})</title>
<script>
var g_rcon_active = -2;
var g_live_info_list = [];
var g_list = [];
var g_interval = 0;
var g_busy = false;
var g_nextRequest = "";
var g_timeout = 0;

const mc_colors = {
    black: "black", // #000000
    dark_blue: "#0000AA", // #0000AA
    dark_green: "#00AA00", // #00AA00
    dark_aqua: "#00AAAA", // #00AAAA
    dark_red: "#AA0000", // #AA0000
    dark_purple: "#AA00AA", // #AA00AA
    gold: "#FFAA00", // #FFAA00
    gray: "#AAAAAA", // #AAAAAA
    dark_gray: "#555555", // #555555
    blue: "#5555FF", // #5555FF
    green: "#55FF55", // #55FF55
    aqua: "#55FFFF", // #55FFFF
    red: "#FF5555", // #FF5555
    light_purple: "#FF55FF", // #FF55FF
    yellow: "#FFFF55", // #FFFF55
    white: "white" // #FFFFFF
};

const disable_controllers = [ 'start', 'name', 'id', 'memo', 'add', 'clear', 'reset' ];

// クォート文字をエンコード
function EncodeQuote(str)
{
    return str.replace(/['"]/g, function(s) {
        let n = s.charCodeAt(0);
        return "%" + n.toString(16);
    })
}

// 文字列エンコード（クォートのケア込み）
function Encode(str)
{
    return EncodeQuote(encodeURIComponent(str));
}

function onLoadResponse()
{
    if (g_timeout) {
        clearTimeout(g_timeout);
        g_timeout = 0;
    }

    //console.log(this.responseText);
    let res = JSON.parse(this.responseText);
    //console.log(res);
    if (res.live_info_list != undefined) {
        g_live_info_list = res.live_info_list;
        updateLiveInfoList(g_live_info_list);
    }
    if (res.aps != undefined) {
        g_list = res.aps;
        updateList(res.aps);
    }
    if (res.rcon != undefined) {
        if (g_rcon_active != res.rcon) {
            g_rcon_active = res.rcon;
            //console.log("rcon:", g_rcon_active);
            updateRconActive(g_rcon_active);
            updateLiveActive(g_rcon_active);
        }
    }
    
    disable_controllers.forEach((id) => {
        let e = document.getElementById(id);
        if (e && e.disabled != false) {
            e.disabled = false;
        }
    })

    g_busy = false;
    if (this.status == 401) {
        // logout to reload
        document.location.reload();
    } else {
        auto_update();
    }
}

function requestTimeout()
{
    g_rcon_active = -2; // 不明
    updateRconActive(g_rcon_active);
    updateLiveActive(-2, "リロードしてください。");
    if (g_timeout) {
        clearTimeout(g_timeout);
        g_timeout = 0;
    }
}

function requestStart(uri)
{
    if (g_busy) return false;
    g_busy = true;
    stop_update();

    //console.log(uri);
    try {
        let req = new XMLHttpRequest();
        //req.addEventListener("progress", onProgressResponse);
        req.addEventListener("load", onLoadResponse);
        req.open("GET", uri);
        req.send();
        g_timeout = setTimeout(requestTimeout, 6000);
    } catch (e) {
        console.log(e);
        requestTimeout();
        return false;
    }
    return true;
}

var g_old_text = "";

function updateList(aps)
{
    let e = document.getElementById("list");
    if (!e) return;
    let text = "";
    text += "<br/><table><thead><tr><th>名前</th><th>プレイヤー名</th><th>メモ</th><th>承諾</th><th>入室</th><th>操作</th></tr></thead><tbody>";
    for (a of aps) {
        const unknown = (a.id === "不明なユーザー")
        const bedrock = (a.id.charAt(0) == '.')
        let id_label = unknown ? '<font color=red>不明なユーザー</font>' : (bedrock ? a.id : '<a href="https://ja.namemc.com/search?q=' + a.id + '" target="_new">' + a.id + '</a>');
        const DONE = "<font color=green>済</font>";
        const YET = "<font color=red>未</font>";
        text += "<tr><td>" + a.name + "</td><td>" + id_label + "</td><td>" + a.memo + "</td><td>" + (a.accept > 0 ? DONE : YET) + "</td><td>" + (a.nicked ? DONE : YET) + "</td><td><fieldset>";
        let result = a.memo.match(RegExp("^\\[(OK|NG|ERROR)\\] "));
        //console.log(result);
        if (result && result[1] == "OK") {
            text += "<button onClick=\"if (confirm('承諾したままですが本当に削除しますか？')) { this.parentNode.disabled=true; g_nextRequest = 'delete?name=" + Encode(a.name) + "';}\">削除</button>";
            text += "<button onClick=\"this.parentNode.disabled=true; g_nextRequest = 'deny?name=" + Encode(a.name) + "&id=" + Encode(a.id) + "';\">拒否</button>";
        } else if (result && result[1] == "ERROR") {
            // [ERROR] の時は削除のみで何も表示しない
            text += "<button onClick=\"this.parentNode.disabled=true; g_nextRequest = 'delete?name=" + Encode(a.name) + "';\">削除</button>";
        } else {
            text += "<button onClick=\"this.parentNode.disabled=true; g_nextRequest = 'delete?name=" + Encode(a.name) + "';\">削除</button>";
            const accept = bedrock ? "承諾(BE)" : "承諾(JE)"
            text += "<button onClick=\"this.parentNode.disabled=true; g_nextRequest = 'accept?name=" + Encode(a.name) + "&id=" + Encode(a.id) + "';\">" + accept + "</button>";
        }
        text += "</fieldset></td></tr>";
    }
    text += "</tbody></table>";
    if (g_old_text !== text) {
        g_old_text = text;
        e.innerHTML = text;
    }
}

function setURL(channelUrl)
{
    let e = document.getElementById('url');
    if (e) e.value = channelUrl;
}

function getChannelAnchor(channelUrl, active)
{
    if (!channelUrl) return '(不明)';
    let platform = '[不明]'
    let title = channelUrl;
    const url = new URL(channelUrl)
    if (url?.hostname?.match(/youtube/)) {
        platform = '<image src="images/youtube_social_icon_' + (active ? 'red' : 'dark') + '.png" alt="Youtube">';
        let pathname = url.pathname?.startsWith('/') ? url.pathname.substring(1) : '(不明)'
        if (pathname === 'watch') {
            title = 'ライブ配信'
        } else {
            title = pathname
        }
    }
    return '<a href="' + channelUrl + '" target="_new">' + platform + '</a>　<span onClick="setURL(\'' + channelUrl + '\')">' + title + '</span>';
}

g_old_live_info_list_text = ""

function makeColorBox(color)
{
    return '<span class="border-box" style="background-color:' + mc_colors[color] + '; width:16px; height:16px;"></span>';
}

function validateUrl(url)
{
    return url.match(/^https:\/\/.*youtube\.com\//) ? true : false;
}

function updateLiveInfoList(live_info_list)
{
    let e = document.getElementById("live_info_list");
    if (!e || g_rcon_active != 2) return;
    let text = "";
    text += "<table>\n";
    text += "<thead><tr><th>操作</th><th>状態</th><th>色</th><th>チャンネル</th></tr></thead>\n";
    text += '<tfoot><form><tr><td>';
    text += '<button id="start" onclick="';
    text += "let url = document.getElementById('url').value;";
    text += "let color = document.getElementById('color').value;";
    text += "if (!validateUrl(url)) { alert('無効なURLです'); return }";
    text += "this.disabled = true;";
    text += "g_nextRequest = 'start?url=' + Encode(url) + (color ? '&color=' + Encode(color) : '');";
    text += '">追加</button>';
    text += '</td><td></td><td align="center">';
    text += '<span id="sample_color">自動</span><br>';
    text += '<select id="color" name="color" onChange="document.getElementById(\'sample_color\').innerHTML = this.value ? makeColorBox(this.value) : \'自動\';">';
    text += '<option value=""></option>';
    for (const key in mc_colors) {
        text += '<option value="' + key + '">' + key + '</option>';
    }
    text += '</select>';
    text += '</td><td>';
    text += '<label>URL:<br><input id="url" type="text" name="url" value="" size="48" autocomplete="off">';
    text += "</td></tr></form></tfoot>";

    text += "<tbody>\n";
    for (live of live_info_list) {
        let channel_anchor = getChannelAnchor(live.config.channelUrl, live.inLive == 1);
        let live_anchor = live.liveUrl ? '<a href="' + live.liveUrl + '" target="_new">' + live.title + '</a>' : '';
        let color = live.config.color ? makeColorBox(live.config.color) : '-';
        let controls = "<button onClick=\"if (confirm('削除しますか？')) { this.disabled=true; g_nextRequest = 'remove?url=" + live.config.channelUrl + "';}\">削除</button>";
        switch (live.inLive) {
            case 1: // 1=ライブ中
                controls += "<button onClick=\"this.disabled=true; g_nextRequest = 'stop?url=" + live.config.channelUrl + "';\">停止</button>";
                break;
            default: // -1=エラー, 0=ライブ待ち, 2=ライブ終了
                let busy = (live.status === 'ライブ確認中') ? " disabled" : "";
                controls += "<button" + busy + " onClick=\"this.disabled=true; g_nextRequest = 'start?url=" + live.config.channelUrl + "';\">開始</button>";
                break;
        }
        text += '<tr><td align="center">' + controls + '</td><td align="center">' + live.status + '</td><td align="center" valign="middle">' + color + '</td><td>' + channel_anchor + '<br>' + live_anchor + "</td></tr>\n";
    }
    text += "</tbody></table>\n";
    if (g_old_live_info_list_text !== text) {
        g_old_live_info_list_text = text;
        e.innerHTML = text;
    }
}

function updateRconActive(flag)
{
    let e = document.getElementById("rcon");
    if (e) {
        let text = "不明";
        if (flag == 2) text = "<font color=green>接続</font>";
        else if (flag == 1) text = "<font color=gold>認証中</font>";
        else if (flag == 0) text = "<font color=gray>切断</font>";
        e.innerHTML = "サーバー：" + text;
    }
    // すべてのコントローラを無効状態にする
    if (flag != 2) document.querySelectorAll("input, button, select").forEach(e => { e.disabled = true; });
}

function updateLiveActive(flag, forceText)
{
    let e = document.getElementById("live");
    if (e) {
        let text = "不明";
        if (flag == 2) text = "";
        else if (flag <= 1) text = "<font color=gray>起動待ち</font>";
        e.innerHTML = "ライブ：" + (forceText?.length > 0 ? forceText : text);
    }
}

function update()
{
    let uri = 'status';
    if (g_nextRequest.length > 0) {
        uri = g_nextRequest;
        g_nextRequest = "";
    }
    requestStart(uri);
}

function stop_update()
{
    if (g_interval) {
        clearInterval(g_interval);
        g_interval = 0;
    }
}

function auto_update()
{
    stop_update();  // 保険
    g_interval = setInterval(update, 3000);
}

function logout()
{
    requestStart('logout');
}

</script>
</head>
<body onload="auto_update()">
<table style="border-width: 0">
    <tr>
        <th style="border-width: 0; padding: 0; font-size: x-large;">
            ライブ配信管理ページ
        </th>
        <td style="border-width: 0; text-align: right; padding-left: 32px; font-size: x-small;">
            (login:${user} / <span class="link" onClick="logout()">logout</span>)
            <a href="https://a-b-c-d.com/mcui/live" target="_help">Help</a>
        </td>
    </tr>
</table>
<hr/>
<div xstyle="margin:16pt; padding:8pt; border:2px dotted silver">
<fieldset>
    <legend>配信転送サービス</legend>
    <p id="rcon">サーバー：</p>
    <p id="live">ライブ：</p>
    <div id="live_info_list" style="margin:0pt; padding:0pt; border:0px">
    </div>
</fieldset>
</div>
<div xstyle="margin:16pt; padding:8pt; border:2px dotted silver">
<fieldset>
    <legend>参加希望者の管理</legend>
    <form>
        <label>名前：<input type="text" id="name" name="name" value="" size="12" autocomplete="off"></label>
        <label>ＩＤ：<input type="text" id="id"   name="id"   value="" size="12" autocomplete="off"></label>
        <label>メモ：<input type="text" id="memo" name="memo" value="" size="12" autocomplete="off"></label>
        <button id="add" onclick="g_nextRequest = 'add?name=' + Encode(this.form.name.value) + '&id=' + Encode(this.form.id.value) + '&memo=' + Encode(this.form.memo.value); this.form.name.value = this.form.id.value = this.form.memo.value = ''; this.disabled=true">追加</button>
        　<button id="clear" onclick="g_nextRequest = 'clear'; this.disabled=true">全削除</button>
        　<button id="reset" onclick="g_nextRequest = 'reset'; this.disabled=true">全拒否</button>
    </form>
    <div id="list" style="margin:0pt; padding:0pt; border:0px">
    </div>
</fieldset>
</div>
</body>
</html>
