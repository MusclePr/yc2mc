<head>
<meta charset="utf-8">
<link rel="stylesheet" type="text/css" href="css/style.css">
<title>ライブ配信管理ページ (${user})</title>
<script>
var g_rcon_active = -2;
var g_live_info_list = [];
var g_list = [];
var g_interval = 0;
var g_busy = false;
var g_timeout = 0;
var g_websocket = null;
var g_server_down = false; // サーバーダウン状態フラグ
var g_connection_failures = 0; // 連続接続失敗カウント
var g_max_failures = 5; // 最大連続失敗回数

// デバッグログ制御設定
const DEBUG_CONFIG = {
    enabled: true,  // デバッグログの有効/無効
    categories: {
        general: true,     // 一般的なデバッグログ
        websocket: true,   // WebSocket関連のログ
        rcon: true,        // RCON関連のログ
        buttons: true,     // ボタン検証関連のログ
        requests: true,    // HTTP リクエスト関連のログ
        dom: true         // DOM 更新関連のログ
    }
};

// ログ制御の使用方法:
// 1. 全てのデバッグログを無効化: DEBUG_CONFIG.enabled = false;
// 2. 特定カテゴリのみ無効化: DEBUG_CONFIG.categories.websocket = false;
// 3. 運用環境では DEBUG_CONFIG.enabled = false; に設定することを推奨

// デバッグログ出力関数
function debugLog(category, message, ...args) {
    if (DEBUG_CONFIG.enabled && DEBUG_CONFIG.categories[category]) {
        console.log(`[DEBUG:${category.toUpperCase()}]`, message, ...args);
    }
}

// 警告ログ出力関数
function warnLog(category, message, ...args) {
    if (DEBUG_CONFIG.enabled && DEBUG_CONFIG.categories[category]) {
        console.warn(`[WARN:${category.toUpperCase()}]`, message, ...args);
    }
}

// エラーログ出力関数（常に出力）
function errorLog(category, message, ...args) {
    console.error(`[ERROR:${category.toUpperCase()}]`, message, ...args);
}

// サーバーダウン状態を設定する関数
function setServerDown(reason) {
    if (g_server_down) return; // 既にダウン状態の場合は何もしない
    
    g_server_down = true;
    errorLog('general', 'Server appears to be down:', reason);
    
    // すべての処理を停止
    stop_update();
    if (g_websocket) {
        g_websocket.close();
        g_websocket = null;
    }
    if (g_timeout) {
        clearTimeout(g_timeout);
        g_timeout = 0;
    }
    g_busy = false;
    
    // UI状態を更新
    updateRconActive(-3); // 新しい状態: サーバーダウン
    updateLiveActive(-3, "サーバーが応答しません。手動でページをリロードしてください。");
    
    // すべてのボタンを無効化
    document.querySelectorAll("input, button, select").forEach(e => { 
        e.disabled = true; 
    });
    
    // リロードボタンのみ有効化
    showReloadPrompt();
}

// リロードプロンプトを表示
function showReloadPrompt() {
    const liveElement = document.getElementById("live");
    if (liveElement) {
        liveElement.innerHTML = 'ライブ：<font color=red>サーバーが応答しません</font> <button onclick="document.location.reload()" style="background-color: #ff4444; color: white; font-weight: bold; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer;">ページをリロード</button>';
    }
}

// 接続成功時にサーバーダウン状態をリセット
function resetServerDown() {
    if (g_server_down) {
        g_server_down = false;
        g_connection_failures = 0;
        debugLog('general', 'Server connection restored, resetting server down state');
    }
}

// クォート文字をエンコード
function EncodeQuote(str)
{
    return str.replace(/['"]/g, function(s) {
        let n = s.charCodeAt(0);
        return "%" + n.toString(16);
    })
}

// 文字列エンコード（クォートのケア込み）
function Encode(str)
{
    return EncodeQuote(encodeURIComponent(str));
}

// クォート文字をデコード
function DecodeQuote(str)
{
    return str.replace(/%([0-9a-fA-F]{2})/g, function(match, hex) {
        let n = parseInt(hex, 16);
        if (n === 34 || n === 39) { // " or '
            return String.fromCharCode(n);
        }
        return match;
    });
}

// 文字列デコード（クォートのケア込み）
function Decode(str)
{
    return DecodeQuote(decodeURIComponent(str));
}

function onLoadResponse()
{
    debugLog('requests', 'onLoadResponse called, status:', this.status, 'readyState:', this.readyState);
    
    if (g_timeout) {
        clearTimeout(g_timeout);
        g_timeout = 0;
    }

    // 成功レスポンスの場合、接続失敗カウントをリセット
    if (this.status >= 200 && this.status < 300) {
        resetServerDown();
    }

    //console.log(this.responseText);
    try {
        let res = JSON.parse(this.responseText);
        debugLog('requests', 'Response parsed successfully:', {
            hasLiveInfoList: res.live_info_list !== undefined,
            hasAps: res.aps !== undefined,
            hasResult: res.result !== undefined,
            hasRcon: res.rcon !== undefined,
            rconValue: res.rcon,
            currentRconActive: g_rcon_active
        });
        
        //console.log(res);
        if (res.live_info_list != undefined) {
            g_live_info_list = res.live_info_list;
            updateLiveInfoList(res.live_info_list);
        }
        if (res.aps != undefined || res.result != undefined) {
            g_list = res.aps;
            updateList(res.aps);
        }
        if (res.rcon != undefined) {
            if (g_rcon_active != res.rcon) {
                debugLog('rcon', 'RCON status changed:', g_rcon_active, '->', res.rcon);
                g_rcon_active = res.rcon;
                //console.log("rcon:", g_rcon_active);
                updateRconActive(g_rcon_active);
                updateLiveActive(g_rcon_active);
            }
        }
        
        if (g_rcon_active == 2) {
            debugLog('rcon', 'RCON active, enabling controllers and validating buttons');
            disable_controllers.forEach((id) => {
                let e = document.getElementById(id);
                if (e && e.disabled != false) {
                    debugLog('rcon', 'Enabling controller:', id, 'current disabled:', e.disabled);
                    e.disabled = false;
                }
            })
            // サーバー接続時にボタン状態を再評価（遅延なしで実行）
            validateChannelAddButton();
            validateAddButton();
        } else {
            debugLog('rcon', 'RCON not active (', g_rcon_active, '), controllers remain disabled');
        }
    } catch (error) {
        errorLog('requests', 'Failed to parse response:', error, 'Response text:', this.responseText);
        // レスポンス解析失敗も接続失敗としてカウント
        handleConnectionFailure();
    }
    
    g_busy = false;
    if (this.status == 401) {
        debugLog('requests', '401 status, reloading page');
        // logout to reload
        document.location.reload();
    }
}

// 接続失敗を処理する関数
function handleConnectionFailure() {
    g_connection_failures++;
    warnLog('general', 'Connection failure count:', g_connection_failures, '/', g_max_failures);
    
    if (g_connection_failures >= g_max_failures) {
        setServerDown(`${g_max_failures} consecutive connection failures`);
    }
}

function requestTimeout()
{
    g_rcon_active = -2; // 不明
    updateRconActive(g_rcon_active);
    updateLiveActive(-2, "リロードしてください。");
    if (g_timeout) {
        clearTimeout(g_timeout);
        g_timeout = 0;
    }
    // タイムアウト時にg_busyを解放
    g_busy = false;
    warnLog('requests', 'Request timeout - g_busy reset to false');
    
    // タイムアウトも接続失敗としてカウント
    handleConnectionFailure();
}

function requestStart(uri)
{
    debugLog('requests', 'requestStart called with URI:', uri, 'g_busy:', g_busy, 'g_server_down:', g_server_down);
    
    // サーバーダウン状態の場合はリクエストを拒否
    if (g_server_down) {
        warnLog('requests', 'Request blocked - server is down');
        return false;
    }
    
    if (g_busy) {
        debugLog('requests', 'Request blocked - already busy');
        return false;
    }
    g_busy = true;

    //console.log(uri);
    try {
        let req = new XMLHttpRequest();
        //req.addEventListener("progress", onProgressResponse);
        req.addEventListener("load", onLoadResponse);
        req.addEventListener("error", function() {
            errorLog('requests', 'XMLHttpRequest error occurred');
            g_busy = false; // エラー時にg_busyを解放
            if (g_timeout) {
                clearTimeout(g_timeout);
                g_timeout = 0;
            }
            // ネットワークエラーも接続失敗としてカウント
            handleConnectionFailure();
        });
        req.addEventListener("abort", function() {
            warnLog('requests', 'XMLHttpRequest aborted');
            g_busy = false; // 中断時にg_busyを解放
            if (g_timeout) {
                clearTimeout(g_timeout);
                g_timeout = 0;
            }
        });
        req.open("GET", uri);
        req.send();
        debugLog('requests', 'Request sent, setting timeout');
        g_timeout = setTimeout(requestTimeout, 6000);
    } catch (e) {
        errorLog('requests', 'Request failed:', e);
        g_busy = false; // 例外時にg_busyを解放
        handleConnectionFailure(); // 例外も接続失敗としてカウント
        requestTimeout();
        return false;
    }
    return true;
}

var g_old_text = "";

function updateList(aps)
{
    let e = document.getElementById("list");
    if (!e) return;
    let text = "";    text += "<br/><table><thead><tr><th>名前</th><th>プレイヤー名</th><th>メモ</th><th>承諾</th><th>入室</th><th>操作</th></tr></thead><tbody>";
    for (a of aps) {
        const unknown = (a.id === "不明なユーザー")
        const bedrock = (a.id.charAt(0) == '.')
        let id_label = unknown ? '<font color=red>不明なユーザー</font>' : (bedrock ? a.id : '<a href="https://ja.namemc.com/search?q=' + a.id + '" target="_new">' + a.id + '</a>');
        const DONE = "<font color=green>済</font>";
        const YET = "<font color=red>未</font>";
        
        let result = a.memo.match(RegExp("^\\[(OK|NG|ERROR)\\] "));

        text += "<tr><td>" + a.name + "</td><td>" + id_label + "</td><td>" + a.memo + "</td>";

        // 承諾カラム（ボタンの表示状態で承認状態を表現）
        text += "<td>";
        if (result && result[1] == "OK") {
            // 承諾済みの場合は拒否ボタンのみ表示
            text += '<button onclick="denyUser(\'' + Encode(a.name) + '\')">拒否</button>';
        } else if (result && result[1] == "NG") {
            // 拒否済みの場合は承諾ボタンのみ表示
            const accept = bedrock ? "承諾（BE）" : "承諾（JE）";
            text += '<button class="success" onclick="debugLog(\'buttons\', \'Accept button clicked for:\', \'' + Encode(a.name) + '\'); requestStart(\'accept?name=' + Encode(a.name) + '\'); this.disabled=true; debugLog(\'buttons\', \'Accept button disabled for:\', \'' + Encode(a.name) + '\');">' + accept + '</button>';
        } else if (result && result[1] == "ERROR") {
            // エラーの場合はエラー表示のみ
            text += '<font color=red>エラー</font>';
        } else {
            // 未処理の場合は承諾・拒否両方のボタンを表示
            const accept = bedrock ? "承諾（BE）" : "承諾（JE）";
            text += '<button class="success" onclick="debugLog(\'buttons\', \'Accept button clicked for:\', \'' + Encode(a.name) + '\'); requestStart(\'accept?name=' + Encode(a.name) + '\'); this.disabled=true; debugLog(\'buttons\', \'Accept button disabled for:\', \'' + Encode(a.name) + '\');">' + accept + '</button> ';
            text += '<button onclick="denyUser(\'' + Encode(a.name) + '\')">拒否</button>';
        }
        text += "</td>";

        text += "<td>" + (a.nicked ? DONE : YET) + "</td>";

        // 操作列（ドロップダウンメニュー - 削除のみ）
        text += "<td>";
        text += '<div class="dropdown-container">';
        text += '<button class="dropdown-button" onclick="toggleDropdown(this)" alt="操作メニュー">';
        text += '<span class="icon">⚙️</span><span class="dropdown-arrow">▼</span>';
        text += '</button>';
        text += '<div class="dropdown-menu">';

        if (result && result[1] == "OK") {
            // 承諾済みの場合
            text += '<div class="dropdown-item danger" onclick="executeDropdownAction(\'delete-approved\', \'' + Encode(a.name) + '\')" title="承諾済みユーザー ' + escapeHtml(a.name) + ' を削除"><span class="icon">🗑</span>削除（承諾済み）</div>';
        } else if (result && result[1] == "ERROR") {
            // エラーの場合は削除のみ
            text += '<div class="dropdown-item danger" onclick="executeDropdownAction(\'delete\', \'' + Encode(a.name) + '\')" title="ユーザー ' + escapeHtml(a.name) + ' を削除"><span class="icon">🗑</span>削除</div>';
        } else {
            // 通常の場合は削除のみ
            text += '<div class="dropdown-item danger" onclick="executeDropdownAction(\'delete\', \'' + Encode(a.name) + '\')" title="ユーザー ' + escapeHtml(a.name) + ' を削除"><span class="icon">🗑</span>削除</div>';
        }

        text += '</div>';
        text += '</div>';
        text += "</td></tr>";
    }
    text += "</tbody></table>";
    if (g_old_text !== text) {
        g_old_text = text;
        e.innerHTML = text;
    }
}

function setURL(channelUrl)
{
    let e = document.getElementById('url');
    if (e) {
        e.value = channelUrl;
        // URL が外部から設定された際も追加ボタンの状態を更新
        validateChannelAddButton();
    }
}

function CroppedText(text, maxLength)
{
    if (text.length <= maxLength) return text;
    return '<span class="cropped-text" title="' + escapeHtml(text) + '">' + escapeHtml(text.substring(0, maxLength) + '...') + '</span>';
}

// HTMLエスケープ用のヘルパー関数
function escapeHtml(unsafe) {
    return unsafe
         .replace(/&/g, "&amp;")
         .replace(/</g, "&lt;")
         .replace(/>/g, "&gt;")
         .replace(/"/g, "&quot;")
         .replace(/'/g, "&#039;");
}

function getChannelAnchor(channelUrl, active)
{
    if (!channelUrl) return '(不明)';
    let platform = '[不明]'
    let title = channelUrl;
    const url = new URL(channelUrl)
    if (url?.hostname?.match(/youtube/)) {
        platform = '<img src="images/youtube_social_icon_' + (active ? 'red' : 'dark') + '.png" alt="Youtube" class="platform-icon">';
        let pathname = url.pathname?.startsWith('/') ? url.pathname.substring(1) : '(不明)'
        if (pathname === 'watch') {
            title = 'ライブ配信'
        } else {
            title = pathname
        }
    } else if (url?.hostname?.match(/twitch\.tv/)) {
        platform = '<img src="images/glitch_flat_' + (active ? 'purple' : 'gray') + '.png" alt="Twitch" class="platform-icon">';
        title = url.pathname?.split('/')[1] ?? '(不明)'
    }
    // タイトルが長すぎる場合、省略する
    title = CroppedText(title, 48);
    return '<a href="' + channelUrl + '" target="_new" class="platform-link">' + platform + '</a><span onClick="setURL(\'' + channelUrl + '\')" class="platform-title">' + title + '</span>';
}

g_old_live_info_list_text = ""

function makeColorBox(color)
{
    return '<span class="border-box" style="background-color:' + mc_colors[color] + '; width:16px; height:16px;"></span>';
}

function validateUrl(url)
{
    return url.match(/^https:\/\/.*(youtube\.com|twitch\.tv)\//) ? true : false;
}

// 色選択のドロップダウンメニューを作成
function makeColorSelector()
{
    let text = "";
    text += '<div class="dropdown-container">';
    text += '<button class="dropdown-button color-selector" onclick="toggleDropdown(this)" style="background: linear-gradient(135deg, #efefef 0%, #ffffff 100%);">';
    text += '<span id="sample_color"><span class="icon">🔄</span></span><span class="dropdown-arrow">▼</span>';
    text += '</button>';
    text += '<div class="dropdown-menu">';
    text += '<div class="dropdown-item" onclick="selectColor(\'\')" title="自動"><span class="icon">🔄</span><span class="color-name">自動</span></div>';
    for (const key in mc_colors) {
        const colorBox = makeColorBox(key);
        const displayName = mc_color_names[key] || key;
        text += '<div class="dropdown-item" onclick="selectColor(\'' + key + '\')" title="' + escapeHtml(displayName) + ' (' + escapeHtml(key) + ')">' + colorBox + ' <span class="color-name">' + displayName + '</span></div>';
    }
    text += '</div>';
    text += '</div>';
    return text;
}

// 色選択の処理
function selectColor(color) {
    // 隠しinput要素に値を設定（フォーム送信用）
    let hiddenInput = document.getElementById('color_hidden');
    if (!hiddenInput) {
        hiddenInput = document.createElement('input');
        hiddenInput.type = 'hidden';
        hiddenInput.id = 'color_hidden';
        hiddenInput.name = 'color';
        document.querySelector('form').appendChild(hiddenInput);
    }
    hiddenInput.value = color;
    
    // サンプル表示を更新
    const sampleElement = document.getElementById('sample_color');
    if (sampleElement) {
        sampleElement.innerHTML = color ? makeColorBox(color) : '<span class="icon">🔄</span>';
    }
    
    // ドロップダウンを閉じる
    document.querySelectorAll('.dropdown-container.open').forEach(dropdown => {
        dropdown.classList.remove('open');
    });
}

function updateLiveInfoList(live_info_list)
{
    let e = document.getElementById("live_info_list");
    if (!e) return;
    let text = "";
    text += "<table>\n";
    text += '<thead><tr><th>操作</th><th>状態</th><th><span class="icon">🎨</span>色</th><th>';
    text += '<a href="https://youtube.com/" target="_new"><img src="images/youtube_social_icon_red.png" alt="Youtube" class="platform-icon"></a>';
    text += '<a href="https://twitch.tv/" target="_new"><img src="images/glitch_flat_purple.png" alt="Twitch" class="platform-icon"></a>';
    text += "チャンネル</th></tr></thead>\n";
    text += '<tfoot><form><tr><td>';
    text += '<button id="start" disabled onclick="';
    text += "let url = document.getElementById('url').value;";
    text += "let color = document.getElementById('color_hidden') ? document.getElementById('color_hidden').value : '';";
    text += "if (!validateUrl(url)) { alert('無効なURLです'); return }";
    text += "this.disabled = true;";
    text += "requestStart('start?url=' + Encode(url) + (color ? '&color=' + Encode(color) : ''));";
    text += '">追加</button>';
    text += '</td><td></td><td align="center">';
    text += makeColorSelector();
    text += '</td><td>';
    text += '<label>URL:<br><input id="url" type="text" name="url" value="" size="48" placeholder="Youtube または Twitch のチャンネルの URL を入力" autocomplete="off" inputmode="url" spellcheck="false" style="ime-mode: disabled;" oninput="validateChannelAddButton()">';
    text += "</td></tr></form></tfoot>";

    text += "<tbody>\n";
    for (live of live_info_list) {
        const channelUrl = Encode(live.config.channelUrl);
        let channel_anchor = getChannelAnchor(live.config.channelUrl, live.inLive == 1);
        let live_anchor = live.liveUrl ? '<a href="' + live.liveUrl + '" target="_new">' + CroppedText(live.title, 48) + '</a>' : '';
        let color = live.config.color ? makeColorBox(live.config.color) : '-';
        let controls = '';

        // ライブ配信の状態に応じてボタンを表示
        switch (live.inLive) {
            case 1: // 1=ライブ中
                controls += "<button onClick=\"this.disabled=true; requestStart('stop?url=" + channelUrl + "');\">停止</button>";
                break;
            default: // -1=エラー, 0=ライブ待ち, 2=ライブ終了
                let busy = (live.status === 'ライブ確認中') ? " disabled" : "";
                controls += "<button" + busy + " onClick=\"this.disabled=true; requestStart('start?url=" + channelUrl + "&color=" + live.config.color + "');\">開始</button>";
                break;
        }

        controls += '<button class="dropdown-button" onclick="toggleDropdown(this)" alt="操作メニュー">';
        controls += '<span class="icon">⚙️</span><span class="dropdown-arrow">▼</span>';
        controls += '</button>';
        controls += '<div class="dropdown-menu">';
        controls += '<div class="dropdown-item danger" onclick="executeLiveControlAction(\'remove\', \'' + channelUrl + '\', \'' + live.config.color + '\')" title="ライブ配信サービス ' + escapeHtml(live.config.channelUrl) + ' を削除"><span class="icon">🗑</span>削除</div>';
        controls += '</div>';
        controls += '</div>';

        text += '<tr><td align="center">' + controls + '</td><td align="center">' + live.status + '</td><td align="center" valign="middle">' + color + '</td><td>' + channel_anchor + '<br>' + live_anchor + "</td></tr>\n";
    }
    text += "</tbody></table>\n";
    if (g_old_live_info_list_text !== text) {
        debugLog('dom', 'updateLiveInfoList: DOM content changed, updating and validating buttons');
        g_old_live_info_list_text = text;
        e.innerHTML = text;
        // DOM更新後にボタンの状態を再評価（DOM要素が作成されるまで少し待つ）
        setTimeout(() => {
            validateChannelAddButton();
        }, 10);
    } else {
        debugLog('dom', 'updateLiveInfoList: No content change detected');
    }
}

function updateRconActive(flag)
{
    debugLog('rcon', 'updateRconActive called with flag:', flag);
    let e = document.getElementById("rcon");
    if (e) {
        let text = "不明";
        if (flag == 2) text = "<font color=green>接続</font>";
        else if (flag == 1) text = "<font color=gold>認証中</font>";
        else if (flag == 0) text = "<font color=gray>切断</font>";
        else if (flag == -3) text = "<font color=red>サーバーダウン</font>";
        e.innerHTML = "サーバー：" + text;
        debugLog('rcon', 'RCON status updated to:', text);
    } else {
        warnLog('rcon', 'RCON element not found');
    }
    
    // すべてのコントローラを無効状態にする（サーバーダウン時も含む）
    if (flag != 2) {
        debugLog('rcon', 'Disabling all controllers due to RCON flag:', flag);
        document.querySelectorAll("input, button, select").forEach(e => { 
            if (!e.disabled) {
                debugLog('rcon', 'Disabling element:', e.id || e.tagName, 'type:', e.type);
            }
            e.disabled = true; 
        });
    }
}

function updateLiveActive(flag, forceText)
{
    let e = document.getElementById("live");
    if (e) {
        let text = "不明";
        if (flag == 2) text = "";
        else if (flag == 1) text = "<font color=gray>起動待ち</font>";
        else if (flag == 0) text = "<font color=gray>起動待ち</font>";
        else if (flag == -3) text = "<font color=red>サーバーダウン</font>";
        e.innerHTML = "ライブ：" + (forceText?.length > 0 ? forceText : text);
    }
}

function update()
{
    // サーバーダウン状態の場合はリクエストしない
    if (g_server_down) {
        debugLog('general', 'Skipping update - server is down');
        return;
    }
    // WebSocketがある場合は状態確認のみ、ない場合はポーリング
    requestStart('status');
}

function stop_update()
{
    if (g_interval) {
        clearInterval(g_interval);
        g_interval = 0;
    }
}

function onBodyLoaded()
{
    debugLog('general', 'onBodyLoaded called');
    stop_update();  // 保険
    // WebSocketを使用してリアルタイム更新を行う
    connectWebSocket();
    // 初期状態でボタンの有効/無効を評価（DOM要素が確実に存在するまで待つ）
    debugLog('buttons', 'Initial button validation');
    
    // DOM要素が存在するまでリトライ
    const retryValidation = (retryCount = 0) => {
        const maxRetries = 10;
        if (retryCount >= maxRetries) {
            warnLog('buttons', 'Max retries reached for initial button validation');
            return;
        }
        
        const urlInput = document.getElementById('url');
        const nameInput = document.getElementById('name');
        
        if (urlInput && nameInput) {
            validateChannelAddButton();
            validateAddButton();
        } else {
            debugLog('buttons', `Initial validation retry ${retryCount + 1}/${maxRetries}, missing elements:`, {
                urlInput: !!urlInput,
                nameInput: !!nameInput
            });
            setTimeout(() => retryValidation(retryCount + 1), 50);
        }
    };
    
    retryValidation();
}

function connectWebSocket()
{
    if (g_server_down) {
        debugLog('websocket', 'Skipping WebSocket connection - server is down');
        return;
    }
    
    if (g_websocket && g_websocket.readyState === WebSocket.OPEN) {
        debugLog('websocket', 'WebSocket already connected, skipping connection attempt');
        return; // 既に接続済み
    }

    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = protocol + '//' + window.location.host + '/mcui/live/api/'; 
    debugLog('websocket', 'Attempting WebSocket connection to:', wsUrl);
    
    g_websocket = new WebSocket(wsUrl);
    
    g_websocket.onopen = function(event) {
        debugLog('websocket', 'WebSocket connected successfully');
        
        // WebSocket接続成功時の状態クリア
        resetServerDown();
        if (g_busy) {
            debugLog('websocket', 'WebSocket connected - clearing g_busy state');
            g_busy = false;
        }
        
        if (g_timeout) {
            debugLog('websocket', 'WebSocket connected - clearing timeout');
            clearTimeout(g_timeout);
            g_timeout = 0;
        }
        
        // 接続成功時は従来のポーリングを停止
        stop_update();
    };
    
    g_websocket.onmessage = function(event) {
        try {
            const data = JSON.parse(event.data);
            debugLog('websocket', 'WebSocket message received, calling handleWebSocketUpdate');
            handleWebSocketUpdate(data);
        } catch (e) {
            errorLog('websocket', 'WebSocket message parse error:', e, 'Raw data:', event.data);
        }
    };
    
    g_websocket.onclose = function(event) {
        debugLog('websocket', 'WebSocket disconnected, code:', event.code, 'reason:', event.reason);
        g_websocket = null;
        
        // WebSocket切断時にg_busyをリセット（HTTP通信が失敗している可能性があるため）
        if (g_busy) {
            warnLog('websocket', 'WebSocket disconnected while g_busy=true, resetting g_busy');
            g_busy = false;
        }
        
        // タイムアウトもクリア
        if (g_timeout) {
            clearTimeout(g_timeout);
            g_timeout = 0;
        }
        
        // WebSocket切断も接続失敗としてカウント
        handleConnectionFailure();
        
        // サーバーダウン状態でなければ再接続を試行
        if (!g_server_down) {
            // WebSocket接続が切れた場合はポーリングにフォールバック
            setTimeout(() => {
                debugLog('websocket', 'Attempting WebSocket reconnection in 3 seconds');
                connectWebSocket(); // 再接続を試行
            }, 3000);
            // フォールバック用のポーリングを開始
            debugLog('websocket', 'Starting fallback polling');
            g_interval = setInterval(update, 3000);
        }
    };
    
    g_websocket.onerror = function(error) {
        errorLog('websocket', 'WebSocket error:', error);
        g_websocket = null;
        
        // WebSocketエラー時にg_busyをリセット
        if (g_busy) {
            warnLog('websocket', 'WebSocket error while g_busy=true, resetting g_busy');
            g_busy = false;
        }
        
        // タイムアウトもクリア
        if (g_timeout) {
            clearTimeout(g_timeout);
            g_timeout = 0;
        }
        
        // WebSocketエラーも接続失敗としてカウント
        handleConnectionFailure();
        
        // サーバーダウン状態でなければポーリングにフォールバック
        if (!g_server_down) {
            // エラー時もポーリングにフォールバック
            debugLog('websocket', 'Starting fallback polling due to WebSocket error');
            g_interval = setInterval(update, 3000);
        }
    };
}

function handleWebSocketUpdate(data)
{
    debugLog('websocket', 'WebSocket update received:', {
        hasLiveInfoList: data.live_info_list !== undefined,
        hasAps: data.aps !== undefined,
        hasRcon: data.rcon !== undefined,
        rconValue: data.rcon,
        currentRconActive: g_rcon_active
    });
    
    if (data.live_info_list !== undefined) {
        g_live_info_list = data.live_info_list;
        updateLiveInfoList(data.live_info_list);
    }
    if (data.aps !== undefined) {
        g_list = data.aps;
        updateList(data.aps);
    }
    if (data.rcon !== undefined) {
        if (g_rcon_active != data.rcon) {
            debugLog('websocket', 'WebSocket RCON status changed:', g_rcon_active, '->', data.rcon);
            g_rcon_active = data.rcon;
            updateRconActive(g_rcon_active);
            updateLiveActive(g_rcon_active);
        }
    }
    
    if (g_rcon_active == 2) {
        debugLog('websocket', 'WebSocket: RCON active, enabling controllers and validating buttons');
        disable_controllers.forEach((id) => {
            let e = document.getElementById(id);
            if (e && e.disabled != false) {
                debugLog('websocket', 'WebSocket: Enabling controller:', id, 'current disabled:', e.disabled);
                e.disabled = false;
            }
        })
        // WebSocket更新時のボタン状態再評価（遅延なしで実行）
        validateChannelAddButton();
        validateAddButton();
    } else {
        debugLog('websocket', 'WebSocket: RCON not active (', g_rcon_active, '), controllers remain disabled');
    }
}

function logout()
{
    requestStart('logout');
}

// 拒否操作の実行
function denyUser(userName) {
    requestStart('deny?name=' + userName);
}

// ドロップダウンメニューの制御
function toggleDropdown(element) {
    const dropdown = element.closest('.dropdown-container');
    const isOpen = dropdown.classList.contains('open');
    
    // 他のドロップダウンを閉じる
    document.querySelectorAll('.dropdown-container.open').forEach(openDropdown => {
        if (openDropdown !== dropdown) {
            openDropdown.classList.remove('open');
        }
    });
    
    // 現在のドロップダウンを切り替え
    if (isOpen) {
        dropdown.classList.remove('open');
    } else {
        dropdown.classList.add('open');
    }
}

// ドロップダウンメニューのアクション実行
function executeDropdownAction(action, userName) {
    // エンコードされた名前をデコードして表示用に使用
    const displayName = Decode(userName);
    console.log(`Executing action: ${action} for user: ${displayName}`);
    switch(action) {
        case 'delete':
            // 未承認ユーザーの削除に確認は不要
            requestStart('delete?name=' + userName);
            break;
        case 'delete-approved':
            // 承諾済みユーザーの削除
            if (confirm(`【承諾済みユーザーの削除】\n${displayName}さんは既に参加を承諾されています。\nこれは承諾したままこのリストから削除のみ行います。\n\n本当に削除しますか？`)) {
                requestStart('delete?name=' + userName);
            }
            break;
        default:
            console.warn('Unknown action:', action);
    }
    
    // ドロップダウンを閉じる
    document.querySelectorAll('.dropdown-container.open').forEach(dropdown => {
        dropdown.classList.remove('open');
    });
}

// ライブ配信管理のドロップダウンアクション実行
function executeLiveControlAction(action, channelUrl, color) {
    console.log(`Executing live control action: ${action} for channel: ${channelUrl}`);
    
    switch(action) {
        case 'remove':
            if (confirm('【ライブ配信削除】\nこの配信監視を削除しますか？\n\nチャンネル情報と設定が失われます。')) {
                requestStart('remove?url=' + channelUrl);
            }
            break;
        default:
            console.warn('Unknown live control action:', action);
    }
    
    // ドロップダウンを閉じる
    document.querySelectorAll('.dropdown-container.open').forEach(dropdown => {
        dropdown.classList.remove('open');
    });
}

// クリック外しでドロップダウンを閉じる
document.addEventListener('click', function(e) {
    if (!e.target.closest('.dropdown-container')) {
        document.querySelectorAll('.dropdown-container.open').forEach(dropdown => {
            dropdown.classList.remove('open');
        });
    }
});

// ID入力欄の半角文字制限
document.addEventListener('DOMContentLoaded', function() {
    const idInput = document.getElementById('id');
    if (idInput) {
        // 入力時の制限
        idInput.addEventListener('input', function(e) {
            // 全角文字を半角に変換し、許可されない文字を除去
            let value = e.target.value;
            // 全角英数字を半角に変換
            value = value.replace(/[Ａ-Ｚａ-ｚ０-９]/g, function(s) {
                return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
            });
            // 半角英数字、アンダースコア、ハイフン、ピリオド以外を除去
            value = value.replace(/[^A-Za-z0-9._-]/g, '');
            e.target.value = value;
        });
        
        // IME入力を無効化
        idInput.addEventListener('compositionstart', function(e) {
            e.preventDefault();
        });
    }
});

// チャンネル追加ボタンの有効/無効化を制御する関数
function validateChannelAddButton(retryCount = 0) {
    debugLog('buttons', 'validateChannelAddButton called, retry:', retryCount);
    const urlInput = document.getElementById('url');
    const startButton = document.getElementById('start');
    
    // DOM要素の存在を詳細にチェック
    debugLog('buttons', 'DOM element check:', {
        urlInputExists: !!urlInput,
        urlInputType: urlInput ? urlInput.type : 'not found',
        urlInputParent: urlInput ? urlInput.parentElement?.tagName : 'not found',
        startButtonExists: !!startButton,
        startButtonType: startButton ? startButton.type : 'not found',
        startButtonParent: startButton ? startButton.parentElement?.tagName : 'not found',
        liveInfoListExists: !!document.getElementById('live_info_list'),
        documentReadyState: document.readyState
    });
    
    if (urlInput && startButton) {
        const url = urlInput.value.trim();
        const isValid = url.length > 0 && validateUrl(url);
        const shouldBeDisabled = !isValid;
        
        debugLog('buttons', 'Channel add button validation:', {
            url: url,
            urlLength: url.length,
            isValid: isValid,
            shouldBeDisabled: shouldBeDisabled,
            currentDisabled: startButton.disabled,
            willChange: startButton.disabled !== shouldBeDisabled
        });
        
        // 状態が実際に変わる時のみ更新（不要な再描画を防ぐ）
        if (startButton.disabled !== shouldBeDisabled) {
            debugLog('buttons', 'Changing channel add button disabled state:', startButton.disabled, '->', shouldBeDisabled);
            startButton.disabled = shouldBeDisabled;
        }
    } else {
        // 要素が見つからない場合、最大3回まで短時間後にリトライ
        if (retryCount < 3) {
            debugLog('buttons', `Channel add button validation retry ${retryCount + 1}/3`);
            setTimeout(() => validateChannelAddButton(retryCount + 1), 20);
            return;
        }
        
        warnLog('buttons', 'Channel add button validation failed - missing elements after retries:', {
            urlInput: !!urlInput,
            startButton: !!startButton,
            allInputs: Array.from(document.querySelectorAll('input')).map(i => ({id: i.id, type: i.type})),
            allButtons: Array.from(document.querySelectorAll('button')).map(b => ({id: b.id, text: b.textContent?.substring(0, 20)}))
        });
    }
}

// 参加希望者管理の追加ボタンの有効/無効化を制御する関数
function validateAddButton() {
    const nameInput = document.getElementById('name');
    const addButton = document.getElementById('add');
    
    if (nameInput && addButton) {
        const name = nameInput.value.trim();
        const shouldBeDisabled = name.length === 0;
        
        // 状態が実際に変わる時のみ更新（不要な再描画を防ぐ）
        if (addButton.disabled !== shouldBeDisabled) {
            addButton.disabled = shouldBeDisabled;
        }
    }
}
