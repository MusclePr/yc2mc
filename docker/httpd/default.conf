server {
    listen 80;
    server_name localhost;

    # Docker内DNSリゾルバの設定 (起動時の名前解決エラー回避のため)
    resolver 127.0.0.11 valid=30s;

    # バックエンドが応答しない場合(502 Bad Gateway, 504 Gateway Timeout)にメンテナンスページを表示
    proxy_intercept_errors on;
    error_page 502 504 /maintenance.html;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # メンテナンスページの設定
    location = /maintenance.html {
        root /usr/share/nginx/html;
        internal;
    }

    # WebSocket proxy for /mcui/live/api/
    location /mcui/live/api/ {
        set $upstream_live "mc-server1-live:8080";
        rewrite ^/mcui/live/api/(.*) /$1 break;
        proxy_pass http://$upstream_live;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # HTTP proxy for /mcui/live/
    location /mcui/live/ {
        set $upstream_live "mc-server1-live:8080";
        rewrite ^/mcui/live/(.*) /$1 break;
        proxy_pass http://$upstream_live;
        proxy_set_header Host $host;
    }

    # HTTP proxy for /mcui/
    location /mcui/ {
        set $upstream_ui "mc-server1-ui:8080";
        rewrite ^/mcui/(.*) /$1 break;
        proxy_pass http://$upstream_ui;
        proxy_set_header Host $host;
    }
}
