<VirtualHost *:80>
    DocumentRoot "/var/www/html"
    ServerName localhost

    <Directory "/var/www/html">
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ProxyPass /mcui/live/api/ ws://mc-server-live:8080/
    ProxyPassReverse /mcui/live/api/ ws://mc-server-live:8080/
    ProxyPass /mcui/live/ http://mc-server-live:8080/
    ProxyPassReverse /mcui/live/ http://mc-server-live:8080/
    ProxyPass /mcui/ http://mc-server-ui:8080/
    ProxyPassReverse /mcui/ http://mc-server-ui:8080/

</VirtualHost>
