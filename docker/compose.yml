# ネットワーク：mc-clustor
# サーバーを追加する場合、このネットワーク内に入れると良い
# 例）
#networks:
#  mc-clustor:
#    external: true
#
#services:
#  my-service:
#    image: my-image
#    networks:
#      - mc-clustor
# 
networks:
  default:
    name: mc-clustor

services:
  # プロキシーサーバー
  mc-proxy:
    container_name: mc-proxy
    image: ghcr.io/musclepr/mc-proxy
    ports:
      - 25565:25577
      - 19132:19132/udp
    environment:
      TYPE: "VELOCITY"
    volumes:
      - "./proxy/data:/server"
      - "./assets/proxy/plugins:/plugins:ro"

  # ロビーサーバー
  mc-lobby:
    container_name: mc-lobby
    extends:
      file: mc-common.yml
      service: mc
    environment:
      SERVER_NAME: "lobby"
      MOTD: "Lobby Server"
      ALLOW_NETHER: "false"
      MODE: "creative"
      LEVEL: "lobby"
      LEVEL_TYPE: "minecraft:flat"
      WORLD: "/original/lobby.zip"
    volumes:
      - "./lobby/data:/data"
      - "./assets/lobby/plugins:/plugins:ro"
      - "./assets/lobby/lobby.zip:/original/lobby.zip:ro"

  # サーバー1
  mc-server1:
    container_name: mc-${SERVER1}
    extends:
      file: mc-common.yml
      service: mc
    environment:
      SERVER_NAME: "${SERVER1}"
      MOTD: "${SERVER1} Server"
      MODE: "survival"
    volumes:
      - "./${SERVER1}/data:/data"
      - "./assets/${SERVER1}/plugins:/plugins:ro"

  # チケットサービス
  mc-lobby-ticket:
    container_name: mc-lobby-ticket
    image: MusclePr/ticket:latest
    volumes:
      - ./lobby/data:/data:ro
    depends_on:
      - mc-lobby

  # 配信支援サービス
  mc-server1-live:
    container_name: mc-${SERVER1}-live
    image: MusclePr/yc2mc:latest
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./${SERVER1}/data:/data:ro"
      - "./${SERVER1}/live:/config"
    tty: true
    stdin_open: true
    environment:
      # YC2MC
      CHANNEL_URL: "${SERVER1_CHANNEL_URL}"
      MCUI_USERNAME: "${SERVER1_MCUI_USERNAME}"
      MCUI_PASSWORD: "${SERVER1_MCUI_PASSWORD}"
      RCON_HOST: "mc-${SERVER1}"
      RCON_PASSWORD: "${SERVER1_RCON_PASSWORD}"
      RCON_PORT: 25575
      TICKET_SERVER: "mc-lobby-ticket:8000"
      # LOBBY
      LOBBY_HOST: mc-lobby
      TP_COMMAND: "mvtp @s a:server1" # ゲートの入り口にテレポートするコマンド。事前にアンカー設定しておくこと。/mv anchor set server1
    depends_on:
      - mc-server1
      - mc-lobby-ticket
  
  mc-server1-ui:
    container_name: mc-${SERVER1}-ui
    image: MusclePr/mcui
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./${SERVER1}/data:/data"
    tty: true
    stdin_open: true
    environment:
      # RCON
      RCON_HOST: mc-${SERVER1}
      RCON_PASSWORD: "${SERVER1_RCON_PASSWORD}"
      RCON_PORT: 25575
      # user[0]
      MCUI_USERNAME: "${SERVER1_MCUI_USERNAME}"
      MCUI_PASSWORD: "${SERVER1_MCUI_PASSWORD}"
      YC2MC_CONTAINER: mc-${SERVER1}-live
      YC2MC_URL: "http://localhost/mcui/live/"

  httpd:
    container_name: httpd
    image: nginx:alpine
    init: true
    ports:
      - 80:80
    volumes:
      - ./httpd/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./httpd/htdocs:/usr/share/nginx/html:ro
